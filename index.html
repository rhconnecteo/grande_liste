<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='30' cy='40' r='12' fill='%231a3a5c'/><circle cx='70' cy='40' r='12' fill='%231a3a5c'/><circle cx='50' cy='75' r='14' fill='%231a3a5c'/><rect x='20' y='55' width='20' height='8' rx='4' fill='%231a3a5c'/><rect x='60' y='55' width='20' height='8' rx='4' fill='%231a3a5c'/><rect x='38' y='88' width='24' height='7' rx='3.5' fill='%231a3a5c'/></svg>" type="image/svg+xml">

<title>Grande Liste Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-night: #0a1120;
    --panel: #121b32;
    --panel-2: #16213c;
    --hairline: rgba(255,255,255,0.08);
    --text: #eef3fb;
    --text-soft: #8ea0c4;
    --text-faint: #5b6c8f;
    --teal: #00e6a8;
    --copper: #ff8a4c;
    --glow-1: rgba(0,230,168,0.09);
    --glow-2: rgba(255,138,76,0.07);

    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  html[data-theme="light"] {
    --ink-night: #eef3fb;
    --panel: #ffffff;
    --panel-2: #f5f8ff;
    --hairline: rgba(18,32,57,0.09);
    --text: #122039;
    --text-soft: #5e708f;
    --text-faint: #8296bc;
    --glow-1: rgba(0,199,145,0.10);
    --glow-2: rgba(255,138,76,0.09);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--body);
    color: var(--text);
    background:
      radial-gradient(1100px 520px at 12% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, var(--glow-2), transparent 55%),
      var(--ink-night);
    min-height: 100vh;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .shell { max-width: 1180px; margin: 0 auto; }

  /* ---------- HEADER ---------- */
  .head {
    padding: 40px 32px 34px;
    border-bottom: 1px solid var(--hairline);
  }

  .head__inner {
    max-width: 1116px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .head__brand { display: flex; align-items: center; gap: 16px; }

  .head__icon {
    width: 54px;
    height: 54px;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
  }

  .head__icon svg { width: 26px; height: 26px; }

  .head__eyebrow {
    margin: 0 0 8px;
    font-family: var(--mono);
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
  }

  .head__title {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 2.5rem;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .head__sub {
    margin: 10px 0 0;
    color: var(--text-soft);
    font-size: 0.98rem;
    max-width: 46ch;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    cursor: pointer;
    flex: none;
  }

  .theme-toggle svg {
    width: 19px;
    height: 19px;
    stroke: var(--text-soft);
  }

  .theme-toggle:hover svg { stroke: var(--teal); }

  .theme-toggle .icon-moon { display: none; }
  html[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="light"] .theme-toggle .icon-moon { display: block; }

  /* ---------- GRID ---------- */
  .board {
    max-width: 1116px;
    margin: 34px auto 0;
    padding: 0 32px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
    gap: 14px;
  }

  .port {
    --accent: #4c8dff;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 22px;
    padding: 20px 20px 18px;
    min-height: 118px;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--text);
    opacity: 0;
    transform: translateY(10px);
    animation: portIn 0.5s ease forwards;
    animation-delay: calc(var(--i) * 45ms);
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  @keyframes portIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .port:hover,
  .port:focus-visible {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent) 55%, var(--hairline));
    box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--accent) 65%, transparent);
  }

  .port__top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .port__code {
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  .port__led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }

  .port:hover .port__led,
  .port:focus-visible .port__led {
    animation: ledPulse 1.1s ease-in-out infinite;
  }

  @keyframes ledPulse {
    0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    50%      { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 32%, transparent); }
  }

  .port__label {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.06rem;
    letter-spacing: -0.01em;
  }

  .port__hint {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--text-soft);
  }

  .port__hint svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    transition: transform 0.2s ease;
  }

  .port:hover .port__hint svg { transform: translateX(3px); }

  /* ---------- FOOTER ---------- */
  .foot {
    max-width: 1116px;
    margin: 0 auto;
    padding: 24px 32px 46px;
    border-top: 1px solid var(--hairline);
    color: var(--text-faint);
    font-size: 0.85rem;
  }

  @media (max-width: 680px) {
    .head { padding: 30px 20px 26px; }
    .head__title { font-size: 1.9rem; }
    .head__inner { align-items: flex-start; }
    .board, .foot { padding-left: 20px; padding-right: 20px; }
    .board { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .port { animation: none; opacity: 1; transform: none; }
    .port__led { animation: none; }
    .port, .port__hint svg { transition: none; }
    body { transition: none; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="head">
      <div class="head__inner">
        <div class="head__brand">
          <div class="head__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="18" stroke="#00e6a8" stroke-width="2"/>
              <circle cx="24" cy="24" r="3" fill="#00e6a8"/>
              <path d="M24 6V11" stroke="#00e6a8" stroke-width="2" stroke-linecap="round"/>
              <path d="M24 37V42" stroke="#00e6a8" stroke-width="2" stroke-linecap="round"/>
              <path d="M42 24H37" stroke="#00e6a8" stroke-width="2" stroke-linecap="round"/>
              <path d="M11 24H6" stroke="#00e6a8" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h1 class="head__eyebrow">Grande Liste</h1>
          </div>
        </div>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Basculer entre mode sombre et mode clair" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="board" id="cardGrid" aria-label="Lignes de service disponibles"></section>
    </main>
  </div>

  <script>
    const LINKS = [
      { label: "GL pour Zélie",         url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Zélie.xlsx?web=1", accent: "#4c8dff" },
      { label: "GL pour Fenitra",         url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Fenitra.xlsx?web=1", accent: "#22d3ee" },
      { label: "GL pour Malala et Lanto",               url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Malala_et_Lanto.xlsx?web=1", accent: "#34e5a8" },
      { label: "GL pour Tyfanie",            url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Tyf.xlsx?web=1", accent: "#ffb454" },
      { label: "GL pour Valérie",           url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Valerie.xlsx?web=1", accent: "#ff6b6b" },
      { label: "GL pour Christiana",  url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Chrissie.xlsx?web=1", accent: "#a78bfa" },
      { label: "GL pour Koloina",                url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Koloina.xlsx?web=1", accent: "#f472b6" },
      { label: "GL pour Mamonjisoa",          url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Mamonjisoa.xlsx?web=1", accent: "#60a5fa" },
      { label: "GL pour Comm",               url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Comm.xlsx?web=1", accent: "#2dd4bf" },
      { label: "GL pour Formation",            url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Tinà.xlsx?web=1", accent: "#fb7185" },
      { label: "GL pour Prod",           url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Prod.xlsx?web=1", accent: "#fbbf24" },
      { label: "GL pour Carine",           url: "https://axiangroup.sharepoint.com/sites/Recrutement_Connecteo/Reprendre%20le%20rfrentiel/DOSSIERS%20HR%20DATA%20et%20BI%20RH/Grande%20liste/Grande%20Liste%20pour%20l'equipe/Carine.xlsx?web=1", accent: "#fbbf24" }
    ];

    const grid = document.getElementById("cardGrid");

    const ARROW_SVG = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="M13 6l6 6-6 6" />
      </svg>`;


    function renderCards(items) {
      grid.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("a");
        card.className = "port";
        card.href = item.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.style.setProperty("--accent", item.accent);
        card.style.setProperty("--i", index);

        card.innerHTML = `
          <div class="port__top">
            <span class="port__led"></span>
          </div>
          <div>
            <h3 class="port__label">${item.label}</h3>
            <span class="port__hint" style="margin-top:10px">Ouvrir le classeur ${ARROW_SVG}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    renderCards(LINKS);

    // ---------- Mode sombre / mode clair ----------
    const root = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    let theme = "dark";

    function applyTheme(next) {
      theme = next;
      if (theme === "light") {
        root.setAttribute("data-theme", "light");
      } else {
        root.removeAttribute("data-theme");
      }
      themeToggle.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
    }

    themeToggle.addEventListener("click", () => {
      applyTheme(theme === "dark" ? "light" : "dark");
    });

    applyTheme(theme);
  </script>
</body>
</html>
